<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>The Long Halls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #000; }
  #frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #000; display: block; }
  #status {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 18px; color: #e6e0d6;
    font: italic 1.25rem/1.4 "IM Fell English", Georgia, serif; letter-spacing: .04em;
    background: radial-gradient(ellipse at center, #0d0605 0%, #000 70%);
    z-index: 2; transition: opacity .3s;
  }
  #status.hide { opacity: 0; pointer-events: none; }
  #msg { opacity: .8; text-shadow: 0 0 12px rgba(150, 24, 18, .5); animation: pulse 2.4s ease-in-out infinite; }
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid rgba(230, 224, 214, .12); border-top-color: #9a1c14;
    box-shadow: 0 0 14px rgba(150, 24, 18, .45);
    animation: spin 1.1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: .85; } }
  #status button {
    background: transparent; color: #e6e0d6; border: 1px solid rgba(230, 224, 214, .35); border-radius: 0;
    padding: 8px 24px; font: inherit; cursor: pointer; transition: color .2s, border-color .2s, text-shadow .2s;
  }
  #status button:hover, #status button:focus-visible { color: #fff; border-color: #a02820; text-shadow: 0 0 12px rgba(150, 24, 18, .6); outline: none; }
  @media (prefers-reduced-motion: reduce) { #msg { animation: none; } }
</style>
</head>
<body>
<iframe id="frame" title="The Long Halls" allow="fullscreen; autoplay; microphone; camera; clipboard-read; clipboard-write; gamepad; geolocation" allowfullscreen></iframe>
<div id="status"><div class="spinner"></div><div id="msg">Loading…</div></div>

<script>
(function () {
  // ====== CONFIG ======
  var OWNER = "AniItsukiCoded";
  var REPO = "The-Long-Hall";
  var BRANCH = "main";
  var FILE = "index.html";
  var RAW_BASE = "https://raw.githubusercontent.com/" + OWNER + "/" + REPO + "/refs/heads/" + BRANCH + "/";
  var RAW_URL = RAW_BASE + FILE;
  var COMMIT_API = "https://api.github.com/repos/" + OWNER + "/" + REPO + "/commits/" + BRANCH;
  var POLL_FILE_MS = 30 * 1000;      // re-check index.html every 30s
  var POLL_COMMIT_MS = 2 * 60 * 1000; // check repo's latest commit every 2 min (catches changes to other files)
  // =====================

  var frame = document.getElementById("frame");
  var status = document.getElementById("status");
  var msg = document.getElementById("msg");

  var currentHash = null;
  var currentSha = null;
  var currentBlobUrl = null;
  var loading = false;
  var revealed = false;

  // ---- How the game gets shown inside the frame ----
  // Hosts like Canva use a Content Security Policy that blocks blob: frames (that's the
  // "ERR_BLOCKED_BY_CSP ... IS BLOCKED" screen). So we try several methods in order and
  // automatically fall back to the next one if a method is blocked. The one that works is remembered.
  //   blob   - works on normal hosts
  //   srcdoc - not covered by frame-src rules, works on Canva-style policies and sandboxed embeds
  //   write  - last resort: write straight into a blank frame
  var STRATS = ["blob", "srcdoc", "write"];
  var stratIdx = 0;
  var renderToken = 0;
  var frameViolations = 0;
  document.addEventListener("securitypolicyviolation", function (e) {
    var d = e.effectiveDirective || e.violatedDirective || "";
    if (/^(frame|child)-src/.test(d)) frameViolations++;
  });
  // Sandboxed hosts give this page an opaque ("null") origin, where blob frames can't load.
  try { if (window.origin === "null" || location.origin === "null") stratIdx = 1; } catch (e) {}

  function hash(str) { // fast FNV-1a
    var h = 0x811c9dc5;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = (h * 0x01000193) >>> 0; }
    return h.toString(16) + ":" + str.length;
  }

  function fetchText(url) {
    var sep = url.indexOf("?") === -1 ? "?" : "&";
    return fetch(url + sep + "_=" + Date.now(), { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    });
  }

  // Make relative URLs inside the loaded page resolve against the repo's raw folder.
  function prepareHtml(html) {
    var baseTag = '<base href="' + RAW_BASE + '">';
    if (/<head[^>]*>/i.test(html)) return html.replace(/<head([^>]*)>/i, "<head$1>" + baseTag);
    if (/<html[^>]*>/i.test(html)) return html.replace(/<html([^>]*)>/i, "<html$1><head>" + baseTag + "</head>");
    return baseTag + html;
  }

  function reveal() {
    revealed = true;
    status.classList.add("hide");
  }

  function attempt(html, i) {
    var token = ++renderToken;
    var violationsAtStart = frameViolations;
    var prepared = prepareHtml(html);
    var strat = STRATS[i];
    var prevBlob = currentBlobUrl;
    var blobUrl = null;
    var wrote = false;

    // After the frame loads, make sure it really shows the game and not a "blocked" error page.
    function verify() {
      setTimeout(function () {
        if (token !== renderToken) return; // a newer render replaced this one
        var ok = frameViolations === violationsAtStart;
        if (ok) {
          try {
            var href = frame.contentWindow.location.href; // throws if it's a cross-origin error page
            if (/^chrome-error:/i.test(href)) ok = false;
          } catch (e) { ok = false; }
        }
        if (ok) {
          stratIdx = i;
          if (prevBlob && prevBlob !== blobUrl) URL.revokeObjectURL(prevBlob);
          currentBlobUrl = blobUrl;
          reveal();
        } else {
          if (blobUrl) URL.revokeObjectURL(blobUrl);
          if (i + 1 < STRATS.length) attempt(html, i + 1);
          else showError(new Error("blocked by this site's security policy"));
        }
      }, 150);
    }

    if (strat === "blob") {
      blobUrl = URL.createObjectURL(new Blob([prepared], { type: "text/html" }));
      frame.removeAttribute("srcdoc");
      frame.onload = verify;
      frame.src = blobUrl;
    } else if (strat === "srcdoc") {
      frame.onload = verify;
      frame.srcdoc = prepared;
    } else {
      frame.removeAttribute("srcdoc");
      frame.onload = function () {
        if (!wrote) {
          wrote = true;
          try { var d = frame.contentDocument; d.open(); d.write(prepared); d.close(); }
          catch (e) { verify(); }
          return;
        }
        verify();
      };
      setTimeout(function () { if (wrote) verify(); }, 1500); // safety net if no second load event fires
      frame.src = "about:blank";
    }
  }

  function render(html) { attempt(html, stratIdx); }

  function showError(e) {
    status.classList.remove("hide");
    status.innerHTML = '<div>The halls are silent. (' + (e && e.message ? e.message : e) + ')</div>' +
      '<button id="retry">Retry</button>';
    document.getElementById("retry").onclick = function () { location.reload(); };
  }

  function load(force) {
    if (loading) return Promise.resolve();
    loading = true;
    return fetchText(RAW_URL).then(function (html) {
      var h = hash(html);
      if (force || h !== currentHash) {
        currentHash = h;
        render(html);
      }
    }).catch(function (e) {
      if (!currentHash) showError(e); // only show error if nothing is displayed yet
      else console.warn("Update check failed:", e);
    }).then(function () { loading = false; });
  }

  function checkCommit() {
    return fetch(COMMIT_API, { cache: "no-store", headers: { "Accept": "application/vnd.github+json" } })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (j) {
        if (!j || !j.sha) return;
        if (currentSha && j.sha !== currentSha) {
          currentSha = j.sha;
          return load(true); // other files changed -> reload the page
        }
        currentSha = j.sha;
      })
      .catch(function () { /* rate-limited, offline or blocked: ignore, file polling still works */ });
  }

  // Initial load
  load(true).then(checkCommit);

  // Auto-update
  setInterval(function () { if (!document.hidden) load(false); }, POLL_FILE_MS);
  setInterval(function () { if (!document.hidden) checkCommit(); }, POLL_COMMIT_MS);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) { load(false); checkCommit(); }
  });
  window.addEventListener("online", function () { load(false); });
})();
</script>
</body>
</html>
